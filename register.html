{% extends "base.html" %}
{% block title %}Patient Registration{% endblock %}
{% block content %}
<div class="form-wrap"><div class="form-card">
  <p class="eyebrow">JOIN SMARTCARE</p><h1>Create account</h1><p class="muted">Register to book and manage appointments.</p>
  <form method="post">
    <label>Full name</label><input name="name" required maxlength="100" placeholder="Enter your full name">
    <label>Email address</label><input name="email" type="email" required maxlength="150" placeholder="you@example.com">
    <label>Phone number</label><input name="phone" required maxlength="20" placeholder="Phone number">
    <label>Password (minimum 6 characters)</label><input name="password" type="password" required minlength="6" placeholder="Create a password">
    <button class="button full" type="submit">Create Account</button>
  </form>
  <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div></div>
{% endblock %}
